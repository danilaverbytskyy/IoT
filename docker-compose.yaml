version: "3.8"

services:
  db:
    image: timescale/timescaledb:2.14.2-pg16
    container_name: db
    environment:
      POSTGRES_DB: iot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1500M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iot_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

#  superset:
#    build: ./superset
#    container_name: superset
#    ports:
#      - "8088:8088"
#    environment:
#      - SUPERSET_SECRET_KEY=super-secret-key-change-me-in-production-12345
#    volumes:
#      - superset_home:/app/superset_home
#    depends_on:
#      db:
#        condition: service_healthy
#    restart: unless-stopped

  backend:
    build: ./backend
    container_name: backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/iot_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"

      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: iot_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword

      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    volumes:
      - ./dags:/opt/airflow/dags
    depends_on:
      - db
    restart: unless-stopped

volumes:
  timescaledb_data:
  superset_home: